<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matches — SkillGRID</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="navbar">
  <div class="brand"><a href="/" style="color:inherit">Skill<span>GRID</span></a></div>
  <nav id="main-nav"></nav>
</header>
<main class="wrap">
  <h2>Your matches</h2>
  <p class="muted">Direct swaps are one-to-one. Chain matches involve 3+ people in a fulfillment loop —
  everyone must accept before it's confirmed.</p>
  <div id="matches-list"></div>

  <div id="schedule-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center;">
    <div class="card" style="max-width:420px; width:90%;">
      <h3>Schedule session</h3>
      <form id="schedule-form">
        <input type="hidden" id="schedule-match-id">
        <label>Date &amp; time</label>
        <input type="datetime-local" id="scheduled-at" required>
        <label>Meeting provider</label>
        <select id="provider">
          <option value="meet">Google Meet</option>
          <option value="zoom">Zoom</option>
        </select>
        <label>Price (only relevant for public paid sessions, else leave 0)</label>
        <input type="number" id="price" value="0" min="0" step="0.01">
        <div class="row">
          <button class="btn" type="submit">Schedule</button>
          <button class="btn secondary" type="button" id="cancel-schedule">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</main>
<script src="/js/nav.js"></script>
<script src="/js/matches.js"></script>
</body>
</html>
