<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sessions — SkillGRID</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="navbar">
  <div class="brand"><a href="/" style="color:inherit">Skill<span>GRID</span></a></div>
  <nav id="main-nav"></nav>
</header>
<main class="wrap">
  <h2>Your sessions</h2>
  <p class="muted">Meeting links are generated automatically (Zoom/Meet, sandbox). Mark a session
  complete to settle tokens for institutional swaps, pay for public sessions, or flag a no-show.</p>
  <div id="sessions-list"></div>

  <div id="review-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center;">
    <div class="card" style="max-width:420px; width:90%;">
      <h3>Leave a review</h3>
      <form id="review-form">
        <input type="hidden" id="review-session-id">
        <input type="hidden" id="review-reviewee-id">
        <label>Rating (1-5)</label>
        <input type="number" id="review-rating" min="1" max="5" required>
        <label>Comment</label>
        <textarea id="review-comment"></textarea>
        <div class="row">
          <button class="btn" type="submit">Submit review</button>
          <button class="btn secondary" type="button" id="cancel-review">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</main>
<script src="/js/nav.js"></script>
<script src="/js/sessions.js"></script>
</body>
</html>
